<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Wajeeh Ahmed — AI/ML Researcher & Software Engineer. BS Computer Science at SZABIST Islamabad. Research in Intrusion Detection Systems, machine learning, and full-stack development." />
    <meta name="keywords" content="Wajeeh Ahmed, AI ML Researcher, Software Engineer, SZABIST, Machine Learning, Intrusion Detection" />
    <title>Wajeeh Ahmed</title>
    <script>
      // Pick the theme before the first paint: the visitor's saved choice, else light.
      (function () {
        var theme
        try { theme = localStorage.getItem('theme') } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') theme = 'light'
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'light' ? '#f5f5f7' : '#000000')
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
